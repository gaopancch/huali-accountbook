<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />
    <meta name="theme-color" content="#07c160" />
    <meta name="description" content="记账宝 - 简洁实用的记账应用" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>记账宝</title>
    <style>
      /* Prevent white screen flash */
      body {
        margin: 0;
        padding: 0;
        background-color: #f5f5f5;
      }

      #root {
        min-height: 100vh;
      }

      /* Loading indicator */
      .app-loading {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        background: linear-gradient(135deg, #07c160 0%, #059b4d 100%);
        color: white;
      }

      .app-loading-spinner {
        width: 60px;
        height: 60px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .app-loading-text {
        font-size: 20px;
        font-weight: 500;
        color: white;
        margin-bottom: 10px;
      }

      .app-loading-subtext {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.8);
        margin-top: 8px;
      }

      .app-loading-debug {
        position: fixed;
        bottom: 20px;
        left: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.8);
        color: #00ff00;
        padding: 15px;
        border-radius: 8px;
        font-family: monospace;
        font-size: 12px;
        line-height: 1.5;
        display: none;
        max-height: 200px;
        overflow-y: auto;
      }

      .app-error {
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        background: #f5f5f5;
        text-align: center;
      }

      .app-error-icon {
        font-size: 60px;
        margin-bottom: 20px;
      }

      .app-error-title {
        font-size: 24px;
        font-weight: bold;
        color: #333;
        margin-bottom: 10px;
      }

      .app-error-message {
        font-size: 16px;
        color: #666;
        margin-bottom: 20px;
      }

      .app-error-button {
        background: #07c160;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        margin: 5px;
      }
    </style>
  </head>
  <body>
    <noscript>您需要启用 JavaScript 才能运行此应用。</noscript>
    <div id="root">
      <div class="app-loading">
        <div class="app-loading-spinner"></div>
        <div class="app-loading-text">记账宝</div>
        <div class="app-loading-subtext">正在加载应用...</div>
      </div>
    </div>

    <div id="app-error" class="app-error">
      <div class="app-error-icon">⚠️</div>
      <div class="app-error-title">应用加载失败</div>
      <div class="app-error-message" id="error-message">JavaScript 加载失败，请检查网络连接</div>
      <button class="app-error-button" onclick="window.location.reload()">重新加载</button>
      <button class="app-error-button" onclick="localStorage.clear(); window.location.reload()">清除数据并重新加载</button>
    </div>

    <div id="debug-info" class="app-loading-debug"></div>

    <script>
      // Debug logger
      var debugLog = [];
      function log(msg) {
        var timestamp = new Date().toISOString().split('T')[1];
        debugLog.push(timestamp + ' - ' + msg);
        console.log(msg);

        // Show debug info after 3 seconds
        setTimeout(function() {
          var debugDiv = document.getElementById('debug-info');
          if (debugDiv) {
            debugDiv.style.display = 'block';
            debugDiv.innerHTML = debugLog.join('<br>');
          }
        }, 3000);
      }

      log('📱 页面开始加载');
      log('🌐 User Agent: ' + navigator.userAgent);
      log('📍 Location: ' + window.location.href);

      // Check if JavaScript is working
      log('✅ JavaScript 正常运行');

      // Timeout to show error if app doesn't load
      var loadTimeout = setTimeout(function() {
        log('❌ 应用加载超时 (10秒)');
        var rootDiv = document.getElementById('root');
        var errorDiv = document.getElementById('app-error');
        if (rootDiv && errorDiv) {
          // Check if React has mounted
          var hasReactRoot = rootDiv.innerHTML !== rootDiv.innerHTML.replace('app-loading', 'xxx');
          if (hasReactRoot) {
            log('⚠️ 应用仍在加载中...');
            document.getElementById('error-message').textContent = '应用加载时间较长，请耐心等待或检查网络连接';
          } else {
            log('❌ React 未能挂载');
            document.getElementById('error-message').textContent = 'JavaScript 加载失败，请刷新页面或清除浏览器缓存后重试';
          }
          rootDiv.style.display = 'none';
          errorDiv.style.display = 'flex';
        }
      }, 10000); // 10 seconds timeout

      // Clear timeout when React mounts
      var observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          if (mutation.type === 'childList' || mutation.type === 'subtree') {
            var loading = document.querySelector('.app-loading');
            if (!loading || loading.style.display === 'none') {
              log('✅ React 应用已挂载');
              clearTimeout(loadTimeout);
              observer.disconnect();
            }
          }
        });
      });

      var rootElement = document.getElementById('root');
      if (rootElement) {
        observer.observe(rootElement, { childList: true, subtree: true });
        log('👀 开始监听 React 挂载');
      }

      // Log when scripts start loading
      window.addEventListener('DOMContentLoaded', function() {
        log('📄 DOM 内容已加载');
      });

      window.addEventListener('load', function() {
        log('🎉 页面资源全部加载完成');
      });

      // Catch script load errors
      window.addEventListener('error', function(e) {
        if (e.target.tagName === 'SCRIPT') {
          log('❌ 脚本加载失败: ' + e.target.src);
        }
      }, true);
    </script>
  </body>
</html>
