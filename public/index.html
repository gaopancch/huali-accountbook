<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />
    <meta name="theme-color" content="#07c160" />
    <meta name="description" content="记账宝 - 简洁实用的记账应用" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>记账宝</title>
    <style>
      /* Prevent white screen flash */
      body {
        margin: 0;
        padding: 0;
        background-color: #f5f5f5;
      }

      #root {
        min-height: 100vh;
      }

      /* Loading indicator */
      .app-loading {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        background: linear-gradient(135deg, #07c160 0%, #059b4d 100%);
        color: white;
      }

      .app-loading-spinner {
        width: 60px;
        height: 60px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .app-loading-text {
        font-size: 20px;
        font-weight: 500;
        color: white;
        margin-bottom: 10px;
      }

      .app-loading-subtext {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.8);
        margin-top: 8px;
      }

      /* Unsupported browser warning */
      .browser-unsupported {
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        background: #f5f5f5;
        text-align: center;
      }

      .browser-unsupported-icon {
        font-size: 60px;
        margin-bottom: 20px;
      }

      .browser-unsupported-title {
        font-size: 24px;
        font-weight: bold;
        color: #333;
        margin-bottom: 10px;
      }

      .browser-unsupported-message {
        font-size: 16px;
        color: #666;
        margin-bottom: 10px;
        padding: 0 20px;
      }

      .browser-unsupported-useragent {
        font-size: 12px;
        color: #999;
        margin: 20px 0;
        padding: 10px;
        background: #e5e5e5;
        border-radius: 4px;
        max-width: 90%;
        word-break: break-all;
      }

      .browser-unsupported-link {
        display: inline-block;
        background: #07c160;
        color: white;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 16px;
        margin: 10px 5px;
      }

      .browser-supported-browsers {
        font-size: 14px;
        color: #666;
        margin-top: 20px;
      }

      .browser-supported-browsers span {
        display: inline-block;
        margin: 5px;
        padding: 5px 10px;
        background: #e5e5e5;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <noscript>您需要启用 JavaScript 才能运行此应用。</noscript>

    <!-- Browser compatibility check -->
    <div id="browser-warning" class="browser-unsupported"></div>

    <div id="root">
      <div class="app-loading">
        <div class="app-loading-spinner"></div>
        <div class="app-loading-text">记账宝</div>
        <div class="app-loading-subtext">正在加载应用...</div>
      </div>
    </div>

    <script>
      // Browser compatibility check
      (function checkBrowserSupport() {
        var ua = navigator.userAgent;
        var isSupported = true;
        var reason = '';

        // Check for required features
        var requiredFeatures = {
          'Promise': typeof Promise !== 'undefined',
          'async/await': (function() {
            try {
              return eval('(async function(){})()') instanceof Promise;
            } catch(e) { return false; }
          })(),
          'Array.includes': Array.prototype.includes !== undefined,
          'String.includes': String.prototype.includes !== undefined,
          'Object.assign': Object.assign !== undefined,
          'Object.entries': Object.entries !== undefined,
          'Array.from': Array.from !== undefined
        };

        var missingFeatures = Object.keys(requiredFeatures).filter(function(f) { return !requiredFeatures[f]; });

        if (missingFeatures.length > 0) {
          isSupported = false;
          reason = '浏览器不支持 ' + missingFeatures.join(', ');
        }

        // Check Chrome version (Chrome 97+ required for React 18)
        var chromeVersion = ua.match(/Chrome\/(\d+)/);
        if (chromeVersion) {
          var version = parseInt(chromeVersion[1]);
          if (version < 90) {
            isSupported = false;
            reason = 'Chrome 版本过低 (当前: ' + version + '，需要: 90+)';
          }
        }

        // Show warning if not supported
        if (!isSupported) {
          var rootDiv = document.getElementById('root');
          var warningDiv = document.getElementById('browser-warning');
          rootDiv.style.display = 'none';
          warningDiv.style.display = 'flex';
          warningDiv.innerHTML =
            '<div class="browser-unsupported-icon">⚠️</div>' +
            '<div class="browser-unsupported-title">您的浏览器不支持此应用</div>' +
            '<div class="browser-unsupported-message">' + reason + '</div>' +
            '<div class="browser-unsupported-message">请使用以下浏览器之一访问：</div>' +
            '<div><a href="https://www.google.com/chrome/" class="browser-unsupported-link" target="_blank">Chrome 浏览器</a></div>' +
            '<div class="browser-supported-browsers">支持的浏览器：<span>Chrome 90+</span><span>Edge 90+</span><span>Firefox 88+</span></div>' +
            '<div class="browser-unsupported-useragent">User Agent: ' + ua + '</div>';
        }
      })();
    </script>
  </body>
</html>
